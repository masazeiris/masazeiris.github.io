<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#1c2a1e" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Masáže Iris" />
<title>Masáže Iris | Profesionální masáže Kladno</title>
<!-- React & Babel CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<!-- Tailwind CSS pro moderní design -->
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body { margin: 0; padding: 0; background: #1c2a1e; font-family: system-ui, -apple-system, sans-serif; color: #f3f4f6; }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

function App() {
  const [activeTab, setActiveTab] = useState('home');
  const [reservation, setReservation] = useState({ name: '', phone: '', service: 'Relaxační masáž', date: '', time: '' });
  const [submitted, setSubmitted] = useState(false);

  const services = [
    { id: 1, name: 'Relaxační aromaterapeutická masáž', time: '60 min', price: '900 Kč', desc: 'Uvolňující masáž s použitím 100% přírodních esenciálních olejů.' },
    { id: 2, name: 'Masáž lavovými kameny (Hot Stones)', time: '90 min', price: '1 300 Kč', desc: 'Hluboce prohříkavá masáž, která zbavuje tělo stresu a napětí.' },
    { id: 3, name: 'Klasická sportovní a rekondiční masáž', time: '45 min', price: '750 Kč', desc: 'Zaměřeno na uvolnění ztuhlých svalů po fyzické zátěži.' },
    { id: 4, name: 'Masáž šíje a zádové sestavy', time: '30 min', price: '550 Kč', desc: 'Rychlá úleva od bolesti přisedavém zaměstnání.' }
  ];

  const handleBooking = (e) => {
    e.preventDefault();
    if(!reservation.name || !reservation.phone || !reservation.date) return;
    setSubmitted(true);
  };

  return (
    <div className="min-h-100vh pb-20">
      {/* Hlavní hlavička */}
      <header className="bg-[#142015] border-b border-[#2d4631] sticky top-0 z-50 px-4 py-3 flex justify-between items-center shadow-md">
        <h1 className="text-xl font-bold tracking-wide text-emerald-400">🌿 Masáže Iris</h1>
        <nav className="flex gap-4 text-sm font-medium">
          <button onClick={() => setActiveTab('home')} className={`transition ${activeTab === 'home' ? 'text-emerald-400 underline' : 'text-gray-300'}`}>Úvod</button>
          <button onClick={() => setActiveTab('services')} className={`transition ${activeTab === 'services' ? 'text-emerald-400 underline' : 'text-gray-300'}`}>Služby</button>
          <button onClick={() => setActiveTab('booking')} className={`transition ${activeTab === 'booking' ? 'text-emerald-400 underline' : 'text-gray-300'}`}>Rezervace</button>
        </nav>
      </header>

      {/* Hlavní obsah */}
      <main className="max-w-md mx-auto p-4">
        {activeTab === 'home' && (
          <div className="space-y-6 animate-fadeIn">
            <div className="rounded-2xl overflow-hidden shadow-lg border border-[#2d4631] bg-[#243727] p-6 text-center">
              <h2 className="text-2xl font-bold mb-2 text-emerald-300">Dopřejte svému tělu hluboký odpočinek</h2>
              <p className="text-gray-300 text-sm mb-6">Profesionální masáže v příjemném a klidném prostředí. Zbavte se stresu a svalového napětí.</p>
              <button 
                onClick={() => setActiveTab('booking')} 
                className="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-xl shadow transition">
                Rezervovat termín
              </button>
            </div>

            <div className="bg-[#243727] border border-[#2d4631] rounded-2xl p-5 shadow">
              <h3 className="font-bold text-emerald-300 mb-2">📍 Kde nás najdete</h3>
              <p className="text-sm text-gray-300 mb-2">Kladno a okolí (přesnou adresu obdržíte v potvrzení rezervace).</p>
              <p className="text-sm text-gray-300">📞 Telefon: <a href="tel:+420123456789" className="text-emerald-400 underline">+420 123 456 789</a></p>
            </div>
          </div>
        )}

        {activeTab === 'services' && (
          <div className="space-y-4 animate-fadeIn">
            <h2 className="text-xl font-bold text-emerald-300 mb-4">Nabídka masáží</h2>
            {services.map(s => (
              <div key={s.id} className="bg-[#243727] border border-[#2d4631] rounded-xl p-4 shadow flex flex-col justify-between">
                <div>
                  <div className="flex justify-between items-start mb-1">
                    <h3 className="font-semibold text-white">{s.name}</h3>
                    <span className="text-emerald-400 font-bold">{s.price}</span>
                  </div>
                  <p className="text-xs text-gray-400 mb-3">Délka: {s.time}</p>
                  <p className="text-sm text-gray-300 mb-4">{s.desc}</p>
                </div>
                <button 
                  onClick={() => { setReservation({...reservation, service: s.name}); setActiveTab('booking'); }}
                  className="self-end px-4 py-2 bg-emerald-700/50 hover:bg-emerald-600 text-emerald-200 text-xs font-semibold rounded-lg transition">
                  Vybrat masáž
                </button>
              </div>
            ))}
          </div>
        )}

        {activeTab === 'booking' && (
          <div className="bg-[#243727] border border-[#2d4631] rounded-2xl p-5 shadow animate-fadeIn">
            <h2 className="text-xl font-bold text-emerald-300 mb-4">Online Rezervace</h2>
            {submitted ? (
              <div className="text-center py-8 space-y-3">
                <div className="text-4xl">✅</div>
                <h3 className="text-lg font-bold text-white">Děkujeme za rezervaci!</h3>
                <p className="text-sm text-gray-300">Váš termín byl předběžně přijat. Ozveme se vám s potvrzením na telefonní číslo <span className="text-emerald-400 font-semibold">{reservation.phone}</span>.</p>
                <button onClick={() => { setSubmitted(false); setActiveTab('home'); }} className="mt-4 px-4 py-2 bg-emerald-600 text-white rounded-xl text-sm">Zpět na úvod</button>
              </div>
            ) : (
              <form onSubmit={handleBooking} className="space-y-4">
                <div>
                  <label className="block text-xs text-gray-400 mb-1">Vybraná služba</label>
                  <select 
                    value={reservation.service} 
                    onChange={e => setReservation({...reservation, service: e.target.value})}
                    className="w-full bg-[#1c2a1e] border border-[#2d4631] rounded-xl p-3 text-sm text-white focus:outline-none focus:border-emerald-500">
                    {services.map(s => <option key={s.id} value={s.name}>{s.name} ({s.price})</option>)}
                  </select>
                </div>
                <div>
                  <label className="block text-xs text-gray-400 mb-1">Vaše jméno</label>
                  <input 
                    type="text" required placeholder="např. Jana Nováková"
                    value={reservation.name} 
                    onChange={e => setReservation({...reservation, name: e.target.value})}
                    className="w-full bg-[#1c2a1e] border border-[#2d4631] rounded-xl p-3 text-sm text-white focus:outline-none focus:border-emerald-500" />
                </div>
                <div>
                  <label className="block text-xs text-gray-400 mb-1">Telefonní číslo</label>
                  <input 
                    type="tel" required placeholder="+420 777 888 999"
                    value={reservation.phone} 
                    onChange={e => setReservation({...reservation, phone: e.target.value})}
                    className="w-full bg-[#1c2a1e] border border-[#2d4631] rounded-xl p-3 text-sm text-white focus:outline-none focus:border-emerald-500" />
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="block text-xs text-gray-400 mb-1">Datum</label>
                    <input 
                      type="date" required
                      value={reservation.date} 
                      onChange={e => setReservation({...reservation, date: e.target.value})}
                      className="w-full bg-[#1c2a1e] border border-[#2d4631] rounded-xl p-3 text-sm text-white focus:outline-none focus:border-emerald-500" />
                  </div>
                  <div>
                    <label className="block text-xs text-gray-400 mb-1">Čas</label>
                    <input 
                      type="time" required
                      value={reservation.time} 
                      onChange={e => setReservation({...reservation, time: e.target.value})}
                      className="w-full bg-[#1c2a1e] border border-[#2d4631] rounded-xl p-3 text-sm text-white focus:outline-none focus:border-emerald-500" />
                  </div>
                </div>
                <button type="submit" className="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-xl shadow transition mt-2">
                  Odeslat rezervaci
                </button>
              </form>
            )}
          </div>
        )}
      </main>

      {/* Dolní navigace pro mobilní zařízení */}
      <footer className="fixed bottom-0 left-0 right-0 bg-[#142015] border-t border-[#2d4631] py-3 px-6 flex justify-around text-xs text-gray-400">
        <button onClick={() => setActiveTab('home')} className={`flex flex-col items-center ${activeTab === 'home' ? 'text-emerald-400' : ''}`}>
          <span>🏠</span> Úvod
        </button>
        <button onClick={() => setActiveTab('services')} className={`flex flex-col items-center ${activeTab === 'services' ? 'text-emerald-400' : ''}`}>
          <span>💆‍♀️</span> Služby
        </button>
        <button onClick={() => setActiveTab('booking')} className={`flex flex-col items-center ${activeTab === 'booking' ? 'text-emerald-400' : ''}`}>
          <span>📅</span> Rezervace
        </button>
      </footer>
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
